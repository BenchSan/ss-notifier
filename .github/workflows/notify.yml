name: ss.com notifier

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check feeds
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notifier.py

      - name: Save seen ads
        run: |
          git config user.name "ss-notifier"
          git config user.email "ss-notifier@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen ads" && git push)
